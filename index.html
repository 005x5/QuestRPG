<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestRPG by 005x5</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background: radial-gradient(circle at top, #263b63, #080b13 70%);
            padding: 25px;
        }

        #game {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 22px;
        }

        header h1 {
            color: #ffd95a;
            font-size: 44px;
            margin: 10px 0;
            text-shadow: 0 0 20px #ffd95a55;
        }

        header p {
            color: #9daac2;
            font-size: 18px;
        }

        #stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat {
            background: #172033;
            border: 1px solid #34425f;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
        }

        .bar {
            height: 17px;
            background: #080c14;
            border-radius: 20px;
            overflow: hidden;
            margin: 6px 0;
        }

        #healthBar {
            height: 100%;
            width: 100%;
            background: #e84b4b;
            transition: .3s;
        }

        #xpBar {
            height: 100%;
            width: 0%;
            background: #e7b83c;
            transition: .3s;
        }

        .bar-text {
            text-align: center;
            font-size: 13px;
            color: #c6cede;
        }

        #screen {
            min-height: 500px;
            background: rgba(12, 17, 28, .98);
            border: 2px solid #34425f;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 0 35px #00000080;
        }

        h2 {
            color: #ffd95a;
            margin-top: 0;
        }

        h3 {
            color: #dce5f7;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 14px;
            margin: 6px 0;
            background: #2a4165;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: .15s;
        }

        button:hover {
            background: #3d5d8d;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        .gold-button {
            background: #765d19;
        }

        .danger-button {
            background: #742e39;
        }

        .success-button {
            background: #285b42;
        }

        .purple-button {
            background: #533578;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 10px 0;
        }

        .big-card {
            background: #1a263c;
            border: 1px solid #344b70;
            border-radius: 14px;
            padding: 28px 20px;
            text-align: center;
        }

        .big-card .icon {
            font-size: 72px;
            min-height: 90px;
        }

        .big-card h3 {
            font-size: 25px;
            margin: 10px 0 20px;
        }

        .big-card button {
            margin-top: 8px;
        }

        .shop-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .shop-tabs button {
            margin: 0;
        }

        .item {
            background: #192338;
            border: 1px solid #34425f;
            border-radius: 12px;
            padding: 17px;
            margin: 10px 0;
        }

        .item h3 {
            margin-top: 0;
            color: #ffd95a;
        }

        .legendary {
            border: 2px solid #b66cff;
            box-shadow: 0 0 18px #8f42ff44;
        }

        .monster {
            text-align: center;
            background: #251a27;
            border: 1px solid #603c56;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .monster-emoji {
            font-size: 80px;
        }

        .monster-health {
            color: #ff6d6d;
            font-weight: bold;
            font-size: 20px;
        }

        .enemy-damage {
            color: #ff8b8b;
            margin: 10px 0;
            font-weight: bold;
        }

        .mission {
            background: #192338;
            border: 1px solid #34425f;
            padding: 17px;
            border-radius: 12px;
            margin: 10px 0;
        }

        .message {
            text-align: center;
            color: #ffd95a;
            min-height: 25px;
            margin-top: 12px;
            font-weight: bold;
        }

        .input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #34425f;
            background: #0c111c;
            color: white;
            font-size: 16px;
            margin: 6px 0;
        }

        .stock-box {
            background: #18253b;
            border: 1px solid #405778;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }

        .stock-price {
            font-size: 30px;
            color: #ffd95a;
            font-weight: bold;
        }

        .stock-up {
            color: #65df8b;
        }

        .stock-down {
            color: #ff6666;
        }

        .popup {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .popup.show {
            display: flex;
        }

        .popup-box {
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            background: #172033;
            border: 2px solid #34425f;
            border-radius: 18px;
            padding: 25px;
        }

        .close {
            background: #702d36;
        }

        .back {
            margin-bottom: 15px;
        }

        .welcome {
            text-align: center;
            font-size: 28px;
            color: #ffd95a;
            margin-bottom: 20px;
        }

        @media(max-width: 750px) {
            #stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .card-grid {
                grid-template-columns: 1fr;
            }

            .shop-tabs {
                grid-template-columns: repeat(2, 1fr);
            }

            header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div id="game">

    <header>
        <h1>⚔️ QuestRPG ⚔️</h1>
        <p>QuestRPG by 005x5</p>
    </header>

    <section id="stats">
        <div class="stat">
            <span class="emoji">👤</span>
            <strong id="name">Gast</strong>
        </div>

        <div class="stat">
            <span class="emoji">⭐</span>
            Level <strong id="level">-</strong>
        </div>

        <div class="stat">
            <span class="emoji">💰</span>
            Gold <strong id="gold">-</strong>
        </div>

        <div class="stat">
            <span class="emoji">❤️</span>
            Leben <strong id="health">-</strong>/<strong id="maxHealth">-</strong>
        </div>
    </section>

    <div class="bar">
        <div id="healthBar"></div>
    </div>

    <div class="bar-text">
        ❤️ Leben
    </div>

    <div class="bar">
        <div id="xpBar"></div>
    </div>

    <div class="bar-text">
        ⭐ XP:
        <span id="xp">-</span> /
        <span id="xpNeeded">-</span>
    </div>

    <main id="screen"></main>

    <div id="message" class="message"></div>
</div>

<!-- AKTIEN POPUP -->
<div id="stockPopup" class="popup">
    <div class="popup-box">
        <h2>📈 Aktien</h2>

        <div class="stock-box">
            <div>Aktueller Preis für 0,5%</div>
            <div class="stock-price" id="stockPrice">250 Gold</div>

            <div id="stockChange"></div>

            <p>
                Vorheriger Preis:
                <strong id="oldStockPrice">250</strong> Gold
            </p>

            <p>
                Noch verfügbar:
                <strong id="stocksAvailable">10</strong> Aktien
            </p>

            <p>
                Deine Aktien:
                <strong id="myStocks">0</strong>
            </p>
        </div>

        <h3>Aktien kaufen</h3>

        <input
            id="buyStocksInput"
            class="input"
            type="number"
            min="1"
            placeholder="Wie viele Aktien?"
        >

        <button class="gold-button" onclick="buyStocks()">
            💰 Aktien kaufen
        </button>

        <h3>Aktien verkaufen</h3>

        <input
            id="sellStocksInput"
            class="input"
            type="number"
            min="1"
            placeholder="Wie viele Aktien?"
        >

        <button onclick="sellStocks()">
            💰 Anzahl verkaufen
        </button>

        <button class="danger-button" onclick="sellAllStocks()">
            💰 Alle verkaufen
        </button>

        <button class="close" onclick="closeStocks()">
            ❌ Schließen
        </button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
