<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>⚔️ QuestRPG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top, #263b63 0%, #111a2d 35%, #070a12 80%);
            padding: 25px;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        #game {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 5px 0;
            color: #ffd95a;
            font-size: clamp(32px, 5vw, 52px);
            text-shadow: 0 0 25px rgba(255, 217, 90, .25);
        }

        header p {
            color: #9daac2;
            margin: 5px;
        }

        #stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat {
            background: #172238;
            border: 1px solid #344563;
            border-radius: 13px;
            padding: 14px 10px;
            text-align: center;
            min-height: 54px;
        }

        .stat strong {
            margin-left: 4px;
        }

        .bar {
            height: 16px;
            background: #060a12;
            border-radius: 30px;
            overflow: hidden;
            margin-top: 7px;
        }

        #healthBar {
            width: 100%;
            height: 100%;
            background: #ef4c55;
            transition: width .25s;
        }

        #xpBar {
            width: 0%;
            height: 100%;
            background: #e7b83c;
            transition: width .25s;
        }

        .bar-text {
            text-align: center;
            color: #c6cede;
            font-size: 13px;
            margin: 5px 0 8px;
        }

        #screen {
            min-height: 560px;
            background: rgba(8, 13, 23, .97);
            border: 2px solid #344563;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 0 35px rgba(0,0,0,.45);
        }

        h2 {
            color: #ffd95a;
            margin-top: 0;
        }

        h3 {
            color: #e5ebf7;
        }

        p {
            line-height: 1.5;
        }

        button {
            width: 100%;
            border-radius: 11px;
            padding: 14px;
            margin: 6px 0;
            background: #263b5e;
            color: white;
            transition: .15s;
        }

        button:hover {
            background: #3a5783;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .gold-button {
            background: #735d1d;
        }

        .danger-button {
            background: #762f39;
        }

        .success-button {
            background: #286046;
        }

        .purple-button {
            background: #513b76;
        }

        .back-button {
            margin-bottom: 18px;
            background: #202d45;
            text-align: left;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 15px 0;
        }

        .card,
        .shop-item,
        .mission,
        .leader-row,
        .admin-user {
            background: #18243a;
            border: 1px solid #344563;
            border-radius: 13px;
            padding: 16px;
        }

        .card {
            text-align: center;
        }

        .card .icon {
            font-size: 38px;
        }

        .shop-item {
            margin: 10px 0;
        }

        .shop-item h3 {
            margin-top: 0;
            color: #ffd95a;
        }

        .shop-item small {
            color: #9daac2;
        }

        .monster {
            text-align: center;
            background: #251927;
            border: 1px solid #603c56;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .monster-emoji {
            font-size: 75px;
        }

        .monster-health {
            color: #ff7070;
            font-weight: bold;
        }

        .battle-log {
            max-height: 150px;
            overflow-y: auto;
            background: #0c121f;
            border-radius: 10px;
            padding: 10px;
            margin-top: 12px;
        }

        .log-line {
            padding: 5px;
            border-bottom: 1px solid #202d42;
            color: #cfd8e9;
        }

        .message {
            min-height: 25px;
            text-align: center;
            color: #ffd95a;
            font-weight: bold;
            margin-top: 12px;
        }

        .small {
            color: #9daac2;
            font-size: 14px;
        }

        .big {
            font-size: 60px;
            text-align: center;
            margin: 15px;
        }

        .separator {
            border-top: 1px solid #344563;
            margin: 20px 0;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            margin: 7px 0 12px;
            border-radius: 11px;
            border: 1px solid #344563;
            background: #0b111d;
            color: white;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #ffd95a;
        }

        label {
            display: block;
            color: #cdd6e8;
            margin-top: 8px;
        }

        .top-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }

        .top-actions button {
            margin: 0;
        }

        .mission {
            margin: 10px 0;
        }

        .mission.completed {
            border-color: #3f8c61;
        }

        .leader-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 8px 0;
        }

        .rank {
            font-size: 25px;
            width: 45px;
            text-align: center;
        }

        .leader-info {
            flex: 1;
        }

        .leader-info strong {
            font-size: 17px;
        }

        .admin-user {
            margin: 7px 0;
            cursor: pointer;
            transition: .15s;
        }

        .admin-user:hover {
            background: #263a5d;
        }

        .admin-selected {
            border: 2px solid #ffd95a;
        }

        .admin-panel {
            background: #131e31;
            border: 1px solid #465a7b;
            border-radius: 15px;
            padding: 18px;
            margin-top: 15px;
        }

        .admin-title {
            color: #ffd95a;
            font-size: 22px;
            margin-top: 0;
        }

        .badge {
            display: inline-block;
            background: #263957;
            border: 1px solid #546b91;
            border-radius: 7px;
            padding: 2px 7px;
            margin-left: 5px;
            font-size: 14px;
        }

        .admin-badge {
            background: #503f20;
            border-color: #8e752e;
        }

        .mine-box {
            text-align: center;
            background: #121c2d;
            border: 1px solid #344563;
            border-radius: 17px;
            padding: 25px;
            margin: 20px 0;
        }

        #mineButton {
            font-size: 22px;
            padding: 25px;
            background: #6b5720;
        }

        .mine-number {
            font-size: 42px;
            color: #ffd95a;
            font-weight: bold;
        }

        .cooldown {
            color: #9daac2;
            margin-top: 10px;
        }

        .equipment {
            background: #121c2d;
            border-radius: 12px;
            padding: 14px;
            margin: 10px 0;
        }

        .center {
            text-align: center;
        }

        .error {
            color: #ff7474;
            text-align: center;
            margin: 8px 0;
        }

        .success {
            color: #67d49a;
            text-align: center;
            margin: 8px 0;
        }

        @media(max-width: 750px) {
            #stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .card-grid {
                grid-template-columns: 1fr;
            }

            .top-actions {
                grid-template-columns: 1fr;
            }

            #screen {
                padding: 17px;
            }
        }
    </style>
</head>

<body>

<div id="game">

    <header>
        <h1>⚔️ QuestRPG ⚔️</h1>
        <p>Dein eigenes Browser-RPG</p>
    </header>

    <section id="stats">

        <div class="stat">
            👤 <strong id="name">Gast</strong>
        </div>

        <div class="stat">
            ⭐ Level <strong id="level">-</strong>
        </div>

        <div class="stat">
            💰 Gold <strong id="gold">-</strong>
        </div>

        <div class="stat">
            ❤️ Leben
            <strong>
                <span id="health">-</span>/<span id="maxHealth">-</span>
            </strong>
        </div>

    </section>

    <div class="bar">
        <div id="healthBar"></div>
    </div>

    <div class="bar-text">
        ❤️ Leben
    </div>

    <div class="bar">
        <div id="xpBar"></div>
    </div>

    <div class="bar-text">
        ⭐ XP:
        <span id="xp">-</span> /
        <span id="xpNeeded">-</span>
    </div>

    <main id="screen"></main>

    <div id="message" class="message"></div>

</div>

<script src="script.js"></script>

</body>
</html>
