<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestRPG by 005x5</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background: radial-gradient(circle at top, #263b63, #070b13 72%);
            padding: 20px;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            border: 0;
            border-radius: 11px;
            background: #294268;
            color: white;
            cursor: pointer;
            transition: .15s;
        }

        button:hover {
            background: #3d5b87;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin: 6px 0;
            border: 1px solid #405579;
            border-radius: 10px;
            background: #0b1422;
            color: white;
        }

        .gold-button {
            background: #80651c;
        }

        .danger-button {
            background: #762f3b;
        }

        .success-button {
            background: #286343;
        }

        .purple-button {
            background: #583778;
        }

        .orange-button {
            background: #874c24;
        }

        #game {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #ffd95a;
            font-size: 42px;
            margin: 10px;
            text-shadow: 0 0 20px #ffd95a55;
        }

        header p {
            color: #9daac2;
        }

        #stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .stat {
            background: #18243a;
            border: 1px solid #344766;
            border-radius: 13px;
            padding: 14px;
            text-align: center;
        }

        .bar {
            height: 16px;
            background: #070c15;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 12px;
        }

        #healthBar {
            height: 100%;
            width: 100%;
            background: #e84b4b;
            transition: .3s;
        }

        #xpBar {
            height: 100%;
            width: 0%;
            background: #e7b83c;
            transition: .3s;
        }

        .bar-text {
            text-align: center;
            color: #c7d0df;
            margin: 5px;
        }

        #screen {
            min-height: 520px;
            margin-top: 15px;
            padding: 25px;
            background: rgba(10,16,27,.98);
            border: 2px solid #344766;
            border-radius: 18px;
            box-shadow: 0 0 35px #0008;
        }

        h2 {
            color: #ffd95a;
        }

        h3 {
            color: #dce6f8;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .menu-card {
            background: #1a2942;
            border: 1px solid #3b506f;
            border-radius: 15px;
            padding: 22px;
            text-align: center;
        }

        .menu-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .card,
        .shop-item {
            background: #192840;
            border: 1px solid #3b506f;
            border-radius: 13px;
            padding: 17px;
            margin: 10px 0;
        }

        .shop-item h3 {
            color: #ffd95a;
            margin-top: 0;
        }

        .back {
            width: auto;
            display: inline-block;
            padding: 10px 18px;
            margin-bottom: 15px;
        }

        .shop-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .shop-tabs button {
            flex: 1;
            min-width: 130px;
        }

        .monster {
            text-align: center;
            background: #281a29;
            border: 1px solid #69435d;
            border-radius: 15px;
            padding: 20px;
        }

        .monster-emoji {
            font-size: 80px;
        }

        .monster-hp {
            color: #ff6868;
            font-weight: bold;
        }

        .boss {
            border-color: #b63232;
            box-shadow: 0 0 25px #8b1e1e55;
        }

        .mine-box {
            text-align: center;
            background: #17243a;
            border: 1px solid #405579;
            border-radius: 18px;
            padding: 25px;
        }

        #mineButton {
            font-size: 23px;
            padding: 25px;
            background: #7b5e19;
        }

        .click-counter {
            font-size: 30px;
            color: #ffd95a;
            margin: 15px;
        }

        .message {
            min-height: 25px;
            text-align: center;
            color: #ffd95a;
            font-weight: bold;
            margin: 12px;
        }

        .small {
            color: #9daac2;
            font-size: 14px;
        }

        .big {
            font-size: 65px;
            text-align: center;
            margin: 15px;
        }

        .auth {
            max-width: 500px;
            margin: 50px auto;
        }

        .auth-box {
            background: #17243a;
            border: 1px solid #405579;
            border-radius: 18px;
            padding: 30px;
        }

        .error {
            color: #ff7373;
            text-align: center;
        }

        .success {
            color: #68dc91;
            text-align: center;
        }

        .rarity {
            color: #ffd95a;
            font-weight: bold;
        }

        .separator {
            border-top: 1px solid #344766;
            margin: 20px 0;
        }

        @media(max-width:750px) {
            #stats {
                grid-template-columns: repeat(2,1fr);
            }

            .menu-grid,
            .card-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 30px;
            }

            #screen {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div id="game">

    <header>
        <h1>⚔️ QuestRPG ⚔️</h1>
        <p>QuestRPG by 005x5</p>
    </header>

    <div id="authScreen"></div>

    <div id="gameUI" style="display:none;">

        <section id="stats">

            <div class="stat">
                👤 <strong id="name">Held</strong>
            </div>

            <div class="stat">
                ⭐ Level <strong id="level">1</strong>
            </div>

            <div class="stat">
                💰 Gold <strong id="gold">50</strong>
            </div>

            <div class="stat">
                ❤️ Leben
                <strong>
                    <span id="health">100</span>/<span id="maxHealth">100</span>
                </strong>
            </div>

        </section>

        <div class="bar">
            <div id="healthBar"></div>
        </div>

        <div class="bar-text">
            ❤️ Leben
        </div>

        <div class="bar">
            <div id="xpBar"></div>
        </div>

        <div class="bar-text">
            ⭐ XP:
            <span id="xp">0</span> /
            <span id="xpNeeded">100</span>
        </div>

        <main id="screen"></main>

        <div id="message" class="message"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
