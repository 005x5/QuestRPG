<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuestRPG by 005x5</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top, #263b63 0%, #101827 45%, #060912 100%);
            padding: 20px;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        #game {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #ffd95a;
            font-size: 44px;
            margin: 10px 0 5px;
            text-shadow: 0 0 25px rgba(255, 217, 90, .3);
        }

        header p {
            color: #9daac2;
            margin: 0;
        }

        #topButtons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .top-button {
            width: auto;
            min-width: 130px;
            padding: 11px 18px;
            background: #172238;
            border: 1px solid #34425f;
            color: white;
            border-radius: 10px;
        }

        .top-button:hover {
            background: #2a3c5d;
        }

        #stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat {
            background: #172238;
            border: 1px solid #34425f;
            padding: 13px;
            border-radius: 12px;
            text-align: center;
        }

        .stat strong {
            margin-left: 4px;
        }

        .bar {
            height: 16px;
            background: #080c14;
            border-radius: 20px;
            overflow: hidden;
            margin: 6px 0;
        }

        #healthBar {
            height: 100%;
            width: 100%;
            background: #ed4c4c;
            transition: width .25s;
        }

        #xpBar {
            height: 100%;
            width: 0%;
            background: #e7b83c;
            transition: width .25s;
        }

        .bar-text {
            text-align: center;
            color: #c6cede;
            font-size: 13px;
            margin-bottom: 7px;
        }

        #screen {
            min-height: 550px;
            background: rgba(8, 13, 23, .97);
            border: 2px solid #34425f;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 0 35px rgba(0,0,0,.4);
        }

        h2 {
            color: #ffd95a;
            margin-top: 0;
        }

        h3 {
            color: #dce5f7;
        }

        button.action {
            width: 100%;
            border-radius: 10px;
            padding: 14px;
            margin: 6px 0;
            background: #263957;
            color: white;
            font-size: 16px;
            transition: .15s;
        }

        button.action:hover {
            background: #3c5780;
            transform: translateY(-2px);
        }

        button.action:active {
            transform: translateY(1px);
        }

        button.gold {
            background: #715b1e;
        }

        button.danger {
            background: #702d36;
        }

        button.success {
            background: #285b42;
        }

        button.purple {
            background: #4d3975;
        }

        .back-button {
            background: #1b2942 !important;
            border: 1px solid #3d4e6d;
            margin-bottom: 20px !important;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 15px 0;
        }

        .card {
            background: #192338;
            border: 1px solid #34425f;
            border-radius: 12px;
            padding: 17px;
            text-align: center;
        }

        .shop-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .shop-tab {
            padding: 12px;
            border-radius: 9px;
            background: #18243a;
            color: white;
            border: 1px solid #34425f;
        }

        .shop-tab.active {
            background: #705b1f;
            border-color: #d4ad35;
        }

        .shop-item {
            background: #192338;
            border: 1px solid #34425f;
            border-radius: 12px;
            padding: 16px;
            margin: 10px 0;
        }

        .shop-item h3 {
            color: #ffd95a;
            margin: 0 0 8px;
        }

        .price {
            color: #ffd95a;
            font-weight: bold;
        }

        .monster {
            text-align: center;
            background: #251a27;
            border: 1px solid #603c56;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .monster-emoji {
            font-size: 75px;
        }

        .monster-health {
            color: #ff6d6d;
            font-weight: bold;
        }

        .message {
            text-align: center;
            color: #ffd95a;
            min-height: 25px;
            margin-top: 12px;
            font-weight: bold;
        }

        .small {
            color: #9daac2;
            font-size: 14px;
        }

        .big {
            font-size: 65px;
            text-align: center;
            margin: 20px;
        }

        .separator {
            border-top: 1px solid #34425f;
            margin: 20px 0;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            margin: 7px 0;
            border-radius: 10px;
            border: 1px solid #34425f;
            background: #0d1422;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #ffd95a;
        }

        .login-box {
            max-width: 500px;
            margin: 40px auto;
        }

        .mining-box {
            text-align: center;
            background: #101b2c;
            border: 1px solid #34425f;
            border-radius: 15px;
            padding: 25px;
        }

        #mineButton {
            font-size: 20px;
            min-height: 75px;
        }

        .click-counter {
            font-size: 28px;
            color: #ffd95a;
            margin: 15px 0;
        }

        .cooldown {
            color: #9daac2;
            margin: 10px;
        }

        .admin-user {
            background: #192338;
            border: 1px solid #34425f;
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
        }

        .admin-user.selected {
            border-color: #ffd95a;
            box-shadow: 0 0 15px rgba(255,217,90,.15);
        }

        .admin-actions {
            margin-top: 15px;
        }

        .admin-badge {
            display: inline-block;
            font-size: 18px;
            margin-left: 5px;
        }

        .status-online {
            color: #4ee58a;
        }

        .status-banned {
            color: #ff6b6b;
        }

        .quest {
            background: #192338;
            border: 1px solid #34425f;
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
        }

        .quest strong {
            color: #ffd95a;
        }

        @media (max-width: 750px) {
            #stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .card-grid {
                grid-template-columns: 1fr;
            }

            .shop-tabs {
                grid-template-columns: repeat(2, 1fr);
            }

            header h1 {
                font-size: 32px;
            }

            #screen {
                padding: 17px;
            }
        }
    </style>
</head>

<body>

<div id="game">

    <header>
        <h1 id="gameTitle">⚔️ QuestRPG ⚔️</h1>
        <p id="subtitle">QuestRPG by 005x5</p>
    </header>

    <div id="topButtons"></div>

    <section id="stats">

        <div class="stat">
            <span class="emoji">👤</span>
            <strong id="name">Gast</strong>
        </div>

        <div class="stat">
            <span class="emoji">⭐</span>
            <span id="levelLabel">Level</span>
            <strong id="level">-</strong>
        </div>

        <div class="stat">
            <span class="emoji">💰</span>
            <span id="goldLabel">Gold</span>
            <strong id="gold">-</strong>
        </div>

        <div class="stat">
            <span class="emoji">❤️</span>
            <span id="healthLabel">Leben</span>
            <strong>
                <span id="health">-</span>/<span id="maxHealth">-</span>
            </strong>
        </div>

    </section>

    <div class="bar">
        <div id="healthBar"></div>
    </div>

    <div class="bar-text">
        <span class="emoji">❤️</span>
        <span id="healthBarText">Leben</span>
    </div>

    <div class="bar">
        <div id="xpBar"></div>
    </div>

    <div class="bar-text">
        <span class="emoji">⭐</span>
        XP:
        <span id="xp">-</span> /
        <span id="xpNeeded">-</span>
    </div>

    <main id="screen"></main>

    <div id="message" class="message"></div>

</div>

<script src="script.js"></script>

</body>
</html>
