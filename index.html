<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>⚔️ QuestRPG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            color: white;

            background:
                radial-gradient(circle at top, #263b63, #080b13 70%);

            display: flex;
            justify-content: center;

            padding: 25px;
        }

        body.no-emoji .emoji {
            display: none;
        }

        #game {
            width: 100%;
            max-width: 950px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 5px 0;

            color: #ffd95a;

            font-size: 44px;

            text-shadow:
                0 0 20px #ffd95a55;
        }

        header p {
            margin-top: 6px;

            color: #aab6ce;
        }

        #stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin-bottom: 14px;
        }

        .stat {
            background: #172033;

            border: 1px solid #34425f;

            padding: 13px;

            border-radius: 12px;

            text-align: center;
        }

        .stat strong {
            margin-left: 5px;
        }

        .bar {
            height: 15px;

            background: #080c14;

            border-radius: 20px;

            overflow: hidden;

            margin: 5px 0;
        }

        #healthBar {
            height: 100%;
            width: 100%;

            background: #e84b4b;

            transition: 0.3s;
        }

        #xpBar {
            height: 100%;
            width: 0%;

            background: #e7b83c;

            transition: 0.3s;
        }

        .bar-text {
            text-align: center;

            font-size: 13px;

            color: #c6cede;
        }

        #screen {
            min-height: 540px;

            background: rgba(12, 17, 28, 0.98);

            border: 2px solid #34425f;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 0 35px #00000080;
        }

        h2 {
            color: #ffd95a;

            margin-top: 0;
        }

        h3 {
            color: #dce5f7;
        }

        button {
            width: 100%;

            border: 0;

            border-radius: 10px;

            padding: 14px;

            margin: 6px 0;

            background: #263957;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition:
                0.15s;
        }

        button:hover:not(:disabled) {
            background: #3c5780;

            transform:
                translateY(-2px);
        }

        button:active:not(:disabled) {
            transform:
                translateY(1px);
        }

        button:disabled {
            cursor: not-allowed;

            opacity: 0.45;
        }

        .success-button {
            background: #285b42;
        }

        .success-button:hover:not(:disabled) {
            background: #367a58;
        }

        .danger-button {
            background: #702d36;
        }

        .danger-button:hover:not(:disabled) {
            background: #8b3843;
        }

        .gold-button {
            background: #715b1e;
        }

        .gold-button:hover:not(:disabled) {
            background: #917729;
        }

        .card-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin: 15px 0;
        }

        .card {
            background: #192338;

            border: 1px solid #34425f;

            border-radius: 12px;

            padding: 15px;

            text-align: center;
        }

        .shop-item {
            background: #192338;

            border: 1px solid #34425f;

            border-radius: 12px;

            padding: 15px;

            margin: 10px 0;
        }

        .shop-item h3 {
            color: #ffd95a;

            margin-top: 0;
        }

        .monster {
            text-align: center;

            background: #251a27;

            border: 1px solid #603c56;

            border-radius: 15px;

            padding: 20px;

            margin-bottom: 20px;
        }

        .monster-emoji {
            font-size: 80px;
        }

        .monster-health {
            color: #ff6d6d;

            font-weight: bold;
        }

        .mission-card {
            background:
                linear-gradient(
                    135deg,
                    #222b42,
                    #182035
                );

            border: 1px solid #566789;

            border-radius: 14px;

            padding: 17px;

            margin: 18px 0;
        }

        .mission-card.completed {
            border-color: #4da56e;
        }

        .mission-text {
            margin: 8px 0;

            font-size: 18px;
        }

        .setting-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            background: #192338;

            border: 1px solid #34425f;

            border-radius: 12px;

            padding: 15px;

            margin: 10px 0;
        }

        .setting-row button {
            width: auto;

            min-width: 130px;

            margin: 0;
        }

        .top-row {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 15px;
        }

        .compact-title {
            margin: 0;
        }

        .back-button {
            width: auto;

            min-width: 120px;

            margin: 0;
        }

        .icon-button {
            width: auto;

            margin: 0;

            padding:
                11px 15px;
        }

        .auth-top {
            display: flex;

            justify-content: flex-end;

            margin-bottom: 10px;
        }

        .auth-top .icon-button {
            width: auto;
        }

        .big {
            font-size: 62px;

            text-align: center;

            margin: 20px;
        }

        .small {
            color: #9daac2;

            font-size: 14px;
        }

        .separator {
            border-top:
                1px solid #34425f;

            margin:
                20px 0;
        }

        .form-group {
            margin: 15px 0;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #cdd6e9;
        }

        .form-group input {
            width: 100%;

            padding: 13px;

            border-radius: 10px;

            border:
                1px solid #3b4b6d;

            background: #0d1421;

            color: white;

            font-size: 16px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #ffd95a;
        }

        .mine-box {
            text-align: center;

            background: #181f31;

            border:
                1px solid #3c4d70;

            border-radius: 16px;

            padding: 20px;
        }

        .mine-button {
            font-size: 21px;

            padding:
                18px;
        }

        #mineBar {
            height: 100%;

            width: 0%;

            background: #c89328;

            transition: 0.15s;
        }

        .message {
            min-height: 25px;

            margin-top: 12px;

            text-align: center;

            color: #ffd95a;

            font-weight: bold;
        }

        @media (max-width: 700px) {

            #stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .card-grid {
                grid-template-columns:
                    1fr;
            }

            .setting-row {
                flex-direction:
                    column;

                align-items:
                    stretch;
            }

            .setting-row button {
                width: 100%;
            }

            header h1 {
                font-size: 31px;
            }

            #screen {
                padding: 18px;
            }

            .top-row {
                align-items:
                    flex-start;
            }
        }
    </style>
</head>

<body>

    <div id="game">

        <header>

            <h1>
                <span class="emoji">⚔️</span>
                QUESTRPG
                <span class="emoji">⚔️</span>
            </h1>

            <p>
                Dein eigenes Browser-RPG
            </p>

        </header>


        <section id="stats">

            <div class="stat">

                <span class="emoji">👤</span>

                <strong id="name">
                    Gast
                </strong>

            </div>


            <div class="stat">

                <span class="emoji">⭐</span>

                Level

                <strong id="level">
                    -
                </strong>

            </div>


            <div class="stat">

                <span class="emoji">💰</span>

                Gold

                <strong id="gold">
                    -
                </strong>

            </div>


            <div class="stat">

                <span class="emoji">❤️</span>

                Leben

                <strong>

                    <span id="health">
                        -
                    </span>

                    /

                    <span id="maxHealth">
                        -
                    </span>

                </strong>

            </div>

        </section>


        <div class="bar">

            <div id="healthBar"></div>

        </div>


        <div class="bar-text">

            <span class="emoji">❤️</span>
            Leben

        </div>


        <div class="bar">

            <div id="xpBar"></div>

        </div>


        <div class="bar-text">

            <span class="emoji">⭐</span>

            XP:

            <span id="xp">
                -
            </span>

            /

            <span id="xpNeeded">
                -
            </span>

        </div>


        <main id="screen"></main>


        <div id="message" class="message"></div>

    </div>


    <script src="script.js"></script>

</body>
</html>
